<style>
:root{
  --ink:#eef3ff; --ink2:#b9c5e8; --accent:#ffc861; --accent-ink:#13203f;
  --ring:#4d8dff; --focus:#9cc2ff;
  --font:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
  min-height:100vh;min-height:100svh;color:var(--ink);font-family:var(--font);
  background:#04070f radial-gradient(120% 85% at 50% 0%,#16285a 0%,#0b1530 38%,#050914 72%,#000 100%) fixed;
  -webkit-font-smoothing:antialiased;
}
.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;contain:strict}
.layer{position:absolute;inset:-48px}
.stars{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%;background:transparent}
.s2{width:1.5px;height:1.5px}
.s3{width:2px;height:2px}
.tw{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;
  box-shadow:0 0 6px 1px rgba(170,205,255,.8);opacity:.2;
  animation:twinkle var(--d,4s) ease-in-out var(--dl,0s) infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.shoot{position:absolute;left:0;top:0;width:0;height:0}
.shoot i{position:absolute;left:0;top:0;width:150px;height:2px;border-radius:2px;opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(200,225,255,.6) 70%,#fff)}
.shoot.go i{animation:shoot 1.1s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes shoot{0%{opacity:0;transform:translateX(0)}12%{opacity:1}100%{opacity:0;transform:translateX(520px)}}
.moon{position:absolute;left:calc(7% + 48px);top:calc(12% + 48px);width:clamp(38px,5vw,62px);height:auto}
.planet{position:absolute;right:calc(5% + 48px);top:calc(8% + 48px);width:clamp(96px,17vw,230px);height:auto}
.earth{position:absolute;left:50%;top:calc(100% - 11vh);width:260vmax;height:260vmax;margin-left:-130vmax;border-radius:50%;
  background:radial-gradient(circle at 50% 0%,#3a7fe0 0,#1a4a9a 1.2%,#0c2a63 3.5%,#06142f 9%,#020611 20%);
  box-shadow:0 -6px 40px rgba(90,160,255,.35),0 -1px 0 rgba(160,205,255,.55)}
.glyph{position:absolute;left:50%;top:63%;transform:translate(-50%,-50%);margin:0;
  font-weight:900;line-height:.82;letter-spacing:-.04em;text-align:center;white-space:nowrap;
  font-size:var(--gs,min(38vw,44vh));user-select:none}
.base{color:transparent;
  background:radial-gradient(circle,rgba(185,210,255,.72) 0 1.2px,transparent 1.8px) 0 0/10px 10px;
  -webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1.5px rgba(150,185,255,.28)}
.lit{position:absolute;inset:0;clip-path:circle(0 at 50% 50%)}
.lit-in{position:absolute;inset:0;transform-origin:0 0}
.hot{color:#ffe7ad;text-shadow:0 0 22px rgba(255,186,84,.55),0 0 2px #fff}
.note{position:absolute;font:600 clamp(11px,1.1vw,14px)/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:#ffd98a;white-space:nowrap;transform:translate(-50%,-50%)}
.astro{position:absolute;left:0;top:0;width:320px;height:260px;transform-origin:110px 140px;will-change:transform}
.astro svg{display:block;width:320px;height:260px;overflow:visible}
.wave{transform-box:view-box;transform-origin:86px 124px}
.astro.waving .wave{animation:wave 1.5s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-28deg)}50%{transform:rotate(12deg)}}
.pbands{animation:bands 30s ease-in-out infinite alternate}
@keyframes bands{to{transform:translateX(-60px)}}
.ptilt{transform-box:view-box;transform-origin:120px 100px;animation:tilt 24s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
.puff{position:absolute;left:0;top:0;width:0;height:0}
.puff i{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 42% 38%,#fff 0,rgba(236,242,255,.9) 35%,rgba(200,215,245,0) 70%)}
.flame{transform-box:fill-box;transform-origin:50% 0}
.bubble{position:absolute;left:0;top:0;padding:7px 12px;border-radius:12px;background:#f4f7ff;color:#13203f;
  font:700 13px/1.2 var(--font);white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;transition:opacity .35s ease}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;background:#f4f7ff;transform:rotate(45deg);border-radius:2px}
.bubble.on{opacity:1}
.copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:max(9vh,64px) 20px 0;gap:14px}
h1{margin:0;font-size:clamp(30px,4.6vw,58px);line-height:1.05;letter-spacing:-.02em;font-weight:850;
  text-shadow:0 2px 24px rgba(5,9,20,.8);text-wrap:balance}
.sub{margin:0;max-width:34ch;font-size:clamp(15px,1.5vw,18px);line-height:1.45;color:var(--ink2);text-wrap:balance;text-shadow:0 1px 12px rgba(5,9,20,.9)}
.path{max-width:min(80vw,420px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 12px/1 var(--mono);
  color:#9fb0dc;padding:6px 10px;border:1px solid rgba(160,190,255,.18);border-radius:999px;background:rgba(10,20,48,.55)}
.path:empty{display:none}
.btn{margin-top:8px;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 22px;border:0;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font:800 16px/1 var(--font);text-decoration:none;cursor:pointer;
  box-shadow:0 8px 26px rgba(255,190,80,.25);transition:transform .16s ease,background-color .16s ease,box-shadow .16s ease;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn svg{width:18px;height:18px}
@media (hover:hover){.btn:hover{background:#ffd685;transform:translateY(-1px);box-shadow:0 12px 30px rgba(255,190,80,.35)}}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.btn[aria-busy="true"]{opacity:.75;cursor:progress}
.status{margin:0;min-height:1.2em;font-size:13px;color:#9fb0dc}
@media (max-width:640px){
  .planet{top:auto;bottom:calc(19% + 48px);right:calc(4% + 48px)}
  .moon{top:calc(37% + 48px);left:calc(9% + 48px)}
  .glyph{font-size:var(--gs,min(46vw,40vh))}
  .copy{padding-top:max(8vh,48px)}
}
@media (prefers-reduced-motion:reduce){
  .tw,.astro.waving .wave,.shoot.go i,.pbands,.ptilt{animation:none}
  .tw{opacity:.6}
  .note{display:none}
  .btn{transition:none}
}
</style>

    for (var i = 0; i < 16; i++) {
      html += '<span class="tw" style="left:' + rnd(3, 97).toFixed(1) + '%;top:' + rnd(3, 70).toFixed(1) +
        '%;--d:' + rnd(2.4, 6).toFixed(2) + 's;--dl:-' + rnd(0, 6).toFixed(2) + 's"></span>';
    }
    tw.innerHTML = html;
  }
  buildStars();

  // ---------- Geometría ----------
  var bw = 0, bh = 0;
  var W, H, S, G; // S = escala del astronauta, G = caja del glifo
  var LENS = { x: 148, y: -78, r: 48 }, HEAD = { x: 8, y: -116 }; // relativo al origen (110,140)
  function measure() {
    W = innerWidth; H = innerHeight;
    S = Math.max(0.58, Math.min(1, Math.min(W, H * 1.25) / 1000));
    var r = gBase.getBoundingClientRect();
    G = { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: r.width, h: r.height, right: r.right, top: r.top };
  }
  measure();

  function world(ox, oy, x, y, rot, face) {
    var c = Math.cos(rot), s = Math.sin(rot), lx = face * S * ox, ly = S * oy;
    return [x + c * lx - s * ly, y + s * lx + c * ly];
  }
  function render(x, y, rot, face, bob) {
    var yy = y + bob;
    astro.style.transform = 'translate3d(' + (x - 110).toFixed(1) + 'px,' + (yy - 140).toFixed(1) + 'px,0) rotate(' +
      rot.toFixed(4) + 'rad) scale(' + (face * S).toFixed(4) + ',' + S.toFixed(4) + ')';
    var L = world(LENS.x, LENS.y, x, yy, rot, face);
    var r = LENS.r * S * Math.max(0.12, Math.abs(face));
    lit.style.clipPath = 'circle(' + r.toFixed(1) + 'px at ' + L[0].toFixed(1) + 'px ' + L[1].toFixed(1) + 'px)';
    litIn.style.transform = 'translate3d(' + (-0.2 * L[0]).toFixed(1) + 'px,' + (-0.2 * L[1]).toFixed(1) + 'px,0) scale(1.2)';
    var Hd = world(HEAD.x, HEAD.y, x, yy, rot, face);
    bubble.style.transform = 'translate3d(' + (Hd[0] - bw / 2).toFixed(1) + 'px,' + (Hd[1] - bh - 14).toFixed(1) + 'px,0)';
  }

  // ---------- Movimiento reducido: escena quieta, texto completo ----------
  if (reduce) {
    lit.style.clipPath = 'none';
    flame.style.opacity = '0';
    var place = function () {
      measure();
      var x = Math.min(W - 120 * S, G.right + 40 * S), y = Math.min(H - 110 * S, G.top + G.h * 0.6);
      astro.style.transform = 'translate3d(' + (x - 110) + 'px,' + (y - 140) + 'px,0) rotate(-0.12rad) scale(' + (-S) + ',' + S + ')';
    };
    place();
    window.addEventListener('resize', place);
    return;
  }

  // ---------- Física de gravedad cero ----------
  var x = G.cx - 160 * S, y = G.cy + 40 * S, vx = 0, vy = 0;
  var face = 1, faceT = 1, rot = 0, rotV = 0, waving = false;
  var refl = $('refl');
  var NOZZLE = { x: -40, y: 62 };
  // Nubes de propulsión: pool fijo de 10, se reciclan
  var puffs = [], puffI = 0, lastPuff = 0, pvx = 0, pvy = 0;
  for (var pi = 0; pi < 10; pi++) {
    var pf = document.createElement('div');
    pf.className = 'puff';
    pf.appendChild(document.createElement('i'));
    scene.insertBefore(pf, astro);
    puffs.push(pf);
  }
  function puff(px, py, dx, dy) {
    var el = puffs[puffI++ % puffs.length];
    el.style.transform = 'translate3d(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px,0)';
    var sc = ((1.4 + Math.random() * 0.9) * S).toFixed(2);
    if (el.firstChild.animate) {
      el.firstChild.animate([
        { opacity: 0.85, transform: 'translate(0,0) scale(' + (0.35 * S).toFixed(2) + ')' },
        { opacity: 0, transform: 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + sc + ')' }
      ], { duration: 900, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    }
  }
  var tx = G.cx, ty = G.cy, manual = false, lastInput = -1e9;
  var mx = 0, my = 0, pmx = 0, pmy = 0;
  var t = 0, last = 0, raf = 0;

  function onPoint(e) {
    tx = e.clientX; ty = e.clientY; manual = true; lastInput = performance.now();
  }
  window.addEventListener('pointermove', onPoint, { passive: true });
  window.addEventListener('pointerdown', onPoint, { passive: true });
  document.addEventListener('pointerleave', function () { lastInput = performance.now() - 2500; });

  var resizeT = 0;
  window.addEventListener('resize', function () {
    measure();
    clearTimeout(resizeT);
    resizeT = setTimeout(buildStars, 220);
  });

  function frame(now) {
    raf = requestAnimationFrame(frame);
    var f = last ? Math.min(3, (now - last) / 16.667) : 1;
    last = now; t += f / 60;

    // Recorrido automático por el glifo si no hay cursor/toque reciente
    if (manual && now - lastInput > 3500) manual = false;
    var cx = tx, cy = ty;
    if (!manual) {
      cx = G.cx + Math.sin(t * 0.33) * G.w * 0.42;
      cy = G.cy + Math.sin(t * 0.61 + 1) * G.h * 0.28;
    }

    // Mira hacia donde va (con histéresis para no girar a cada píxel)
    // Gira con un pequeño impulso angular, como en gravedad cero
    if (faceT > 0 && cx < x - 24 * S) { faceT = -1; rotV -= 0.035; }
    else if (faceT < 0 && cx > x + 24 * S) { faceT = 1; rotV += 0.035; }
    face += (faceT - face) * Math.min(1, 0.11 * f);

    // El centro de la lupa persigue al objetivo: el cuerpo queda detrás
    var gx = cx - faceT * S * LENS.x, gy = cy - S * LENS.y;
    gx = Math.max(60 * S, Math.min(W - 60 * S, gx));
    gy = Math.max(90 * S, Math.min(H - 70 * S, gy));
    var k = manual ? 0.0062 : 0.0035, damp = Math.pow(manual ? 0.9 : 0.92, f);
    vx = (vx + (gx - x) * k * f) * damp;
    vy = (vy + (gy - y) * k * f) * damp;
    var sp = Math.sqrt(vx * vx + vy * vy);
    if (sp > 26) { vx *= 26 / sp; vy *= 26 / sp; sp = 26; }
    x += vx * f; y += vy * f;

    // Inclinación según la velocidad (resorte angular suave) + balanceo lento
    var rotT = Math.max(-0.3, Math.min(0.3, vx * 0.022)) + Math.sin(t * 0.7) * 0.07;
    rotV = (rotV + (rotT - rot) * 0.012 * f) * Math.pow(0.9, f);
    rot += rotV * f;
    var bob = Math.sin(t * 1.15) * 7 * S;
    render(x, y, rot, face, bob);

    var th = Math.min(1, sp / 9);
    flame.style.opacity = (0.12 + th * 0.88).toFixed(2);
    flame.style.transform = 'scale(' + (0.7 + th * 0.4).toFixed(2) + ',' + (0.35 + th * 0.9).toFixed(2) + ')';

    // Nube de propulsión al acelerar
    var acc = Math.abs(vx - pvx) + Math.abs(vy - pvy);
    pvx = vx; pvy = vy;
    if (sp > 3.5 && acc > 0.18 * f && now - lastPuff > 70) {
      lastPuff = now;
      var N = world(NOZZLE.x, NOZZLE.y, x, y + bob, rot, face);
      puff(N[0], N[1], -vx * 5 + (Math.random() - 0.5) * 16, -vy * 5 + 18 + Math.random() * 10);
    }

    // Saluda cuando el cursor se queda quieto (o en recorrido automático, a ratos)
    var still = manual ? now - lastInput > 1200 : (t % 9) < 3;
    if (still !== waving) { waving = still; astro.classList.toggle('waving', still); }

    // El visor refleja el cielo: las estrellas se desplazan con el parallax
    refl.setAttribute('transform', 'translate(' + (-mx * 10).toFixed(2) + ' ' + (-my * 6).toFixed(2) + ')');

    // Parallax suave
    pmx = (cx / W - 0.5); pmy = (cy / H - 0.5);
    mx += (pmx - mx) * Math.min(1, 0.04 * f); my += (pmy - my) * Math.min(1, 0.04 * f);
    for (var i = 0; i < layers.length; i++) {
      var d = layers[i].d;
      layers[i].el.style.transform = 'translate3d(' + (-mx * d).toFixed(2) + 'px,' + (-my * d).toFixed(2) + 'px,0)';
    }
  }

  function start() { if (!raf && !document.hidden) { last = 0; raf = requestAnimationFrame(frame); } }
  function stop() { cancelAnimationFrame(raf); raf = 0; }
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  start();

  // ---------- Globo de diálogo ----------
  var sayI = 0;
  function say() {
    if (!document.hidden) {
      bubble.textContent = T.say[sayI++ % T.say.length];
      bw = bubble.offsetWidth; bh = bubble.offsetHeight; // se mide solo al cambiar el texto
      bubble.classList.add('on');
      setTimeout(function () { bubble.classList.remove('on'); }, 3200);
    }
    setTimeout(say, 7500);
  }
  setTimeout(say, 1600);

  // ---------- Estrella fugaz ocasional ----------
  var shoot = $('shoot');
  function shootingStar() {
    if (!document.hidden) {
      shoot.classList.remove('go');
      shoot.style.transform = 'translate3d(' + rnd(W * 0.05, W * 0.7).toFixed(0) + 'px,' + rnd(H * 0.03, H * 0.35).toFixed(0) +
        'px,0) rotate(' + rnd(18, 34).toFixed(1) + 'deg)';
      void shoot.offsetWidth;
      shoot.classList.add('go');
    }
    setTimeout(shootingStar, rnd(5000, 12000));
  }
  setTimeout(shootingStar, 2500);
})();
</script>
</body>
</html>
